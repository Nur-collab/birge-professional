name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: birge
          POSTGRES_PASSWORD: birge
          POSTGRES_DB: birge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U birge -d birge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_REDIS_URL: redis://localhost:6379/0
      PII_ENCRYPTION_KEY: ci-only-pii-encryption-key
      OTP_HASH_KEY: ci-only-otp-hash-key
    defaults:
      run:
        working-directory: birge-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            birge-backend/requirements.txt
            birge-backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Migrations (SQLite)
        env:
          DATABASE_URL: sqlite:///./_ci_migration.db
        run: |
          alembic upgrade head
          alembic check

      - name: Migrations (PostgreSQL)
        env:
          DATABASE_URL: postgresql://birge:birge@localhost:5432/birge_test
        run: |
          alembic upgrade head
          alembic check
      - name: Check OpenAPI snapshot
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- ../birge/openapi.json

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    env:
      PII_ENCRYPTION_KEY: e2e-only-pii-encryption-key
      OTP_HASH_KEY: e2e-only-otp-hash-key
    defaults:
      run:
        working-directory: birge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            birge-backend/requirements.txt
            birge-backend/requirements-e2e.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: birge/package-lock.json
      - name: Install backend dependencies
        working-directory: birge-backend
        run: pip install -r requirements.txt -r requirements-e2e.txt
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        run: npm run e2e

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: birge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: birge/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Check generated API types
        run: |
          npm run api:types
          git diff --exit-code -- src/types/api.d.ts
