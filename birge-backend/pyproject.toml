[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["venv", ".venv", "__pycache__", "alembic/versions"]

[tool.ruff.lint]
# Correctness, unused imports/variables, and bugbear checks; B008 is standard FastAPI Depends().
select = ["E9", "F", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
